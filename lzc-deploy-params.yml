params:
  - id: dbx_password
    type: secret
    name: "DBX Password"
    description: "Password used to sign in to the DBX web interface"
    default_value: "$random(len=20)"
    optional: false

  - id: dbx_web_mcp_token
    type: secret
    name: "Web MCP Token"
    description: "Long random secret used to authenticate DBX Web MCP clients"
    default_value: "$random(len=32)"
    optional: false

  - id: dbx_web_mcp_allowed_hosts
    type: string
    name: "Web MCP Allowed Hosts"
    description: "Comma-separated Host values Web MCP requests may use. Each entry is a bare host or host:port; a bare host matches any port. Defaults to the in-container service name. Required when a Web MCP token is set."
    default_value: "dbx"
    optional: false

  - id: dbx_web_mcp_allowed_origins
    type: string
    name: "Web MCP Allowed Origins"
    description: "Comma-separated browser Origins allowed to call Web MCP. Each entry must be a full origin like https://dbx.example.com (scheme + host, no path, no trailing slash). Leave empty unless you connect a browser MCP client; empty denies all non-loopback browser origins while the app itself keeps working."
    default_value: ""
    optional: true

locales:
  en:
    dbx_password:
      name: "DBX Password"
      description: "Password used to sign in to the DBX web interface"
    dbx_web_mcp_token:
      name: "Web MCP Token"
