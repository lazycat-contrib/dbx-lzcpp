    dbx_web_mcp_allowed_hosts:
      name: "Web MCP Allowed Hosts"
      description: "Allowed Host header values for Web MCP clients, for example localhost:4224"
    dbx_web_mcp_allowed_origins:
      name: "Web MCP Allowed Origins"
      description: "允许调用 Web MCP 的浏览器 Origin，逗号分隔；每项必须是完整 origin（如 https://dbx.example.com，只有协议+主机、不带路径和斜杠）。不用浏览器 MCP 客户端就留空；留空仅拒绝非回环的浏览器 Origin，应用本身不受影响。"
  zh:
    dbx_password:
