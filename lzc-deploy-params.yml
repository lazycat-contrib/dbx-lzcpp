params:
  - id: dbx_password
    type: secret
    name: "DBX Password"
    description: "Password used to sign in to the DBX web interface"
    default_value: "$random(len=20)"
    optional: false

  - id: dbx_web_mcp_token
    type: secret
    name: "Web MCP Token"
    description: "Long random secret used to authenticate DBX Web MCP clients"
    default_value: "$random(len=32)"
    optional: false

  - id: dbx_web_mcp_allowed_hosts
    type: string
    name: "Web MCP Allowed Hosts"
    description: "Allowed Host header values for Web MCP clients, for example localhost:4224"
    default_value: "localhost:4224"
    optional: false

  - id: dbx_web_mcp_allowed_origins
    type: string
    name: "Web MCP Allowed Origins"
    description: "Allowed browser MCP client Origins; use * to allow all Origins"
    default_value: "*"
    optional: false

locales:
